<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeRacer Stats</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme_mode');
          var isDark = stored === 'dark' || ((!stored || stored === 'auto') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-beige-50 dark:bg-beige-950 text-beige-900 dark:text-beige-100 transition-colors duration-200">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
